<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E5B3C">
<title>Survey Flecha Seca</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: one-screen field app. Fixed header with progress, scrolling list, main action in a bar at the thumb. */
:root {
  color-scheme: light;
  --bg: #F2F4EF;
  --surface: #FFFFFF;
  --ink: #15201A;
  --muted: #55635A;
  --line: #DDE2DB;
  --line-strong: #AEB8B0;
  --head: #1E5B3C;
  --head-ink: #FFFFFF;
  --head-sub: #D5E6DA;
  --head-track: #12402A;
  --brand: #1E5B3C;
  --brand-ink: #FFFFFF;
  --brand-text: #1E5B3C;
  --brand-soft: #E3F1E7;
  --warn-bg: #FFF1D6;
  --warn-ink: #7A4100;
  --warn-line: #E0A84A;
  --bar: #F0B94A;
  --bad: #A32A1F;
  --scrim: rgba(21, 32, 26, 0.6);
  --font: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-num: 'Barlow Condensed', 'Barlow', system-ui, Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0F1612; --surface: #18221C; --ink: #EAF0EA; --muted: #A3B1A7;
    --line: #2A362E; --line-strong: #55675A;
    --head: #163F2B; --head-ink: #FFFFFF; --head-sub: #C3DBCB; --head-track: #0B2418;
    --brand: #2B7650; --brand-ink: #FFFFFF; --brand-text: #8FD3AC; --brand-soft: #1C3A2A;
    --warn-bg: #3A2A0A; --warn-ink: #F5CC7A; --warn-line: #8A6418; --bar: #F0B94A;
    --bad: #FF9A8C; --scrim: rgba(0, 0, 0, 0.66);
    color-scheme: dark;
  }
}

html, body { height: 100%; }
body {
  margin: 0; background: var(--head); color: var(--ink);
  font-family: var(--font); font-size: 16px; line-height: 1.3;
  -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
}
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
button { appearance: none; border: 0; background: none; padding: 0; margin: 0; cursor: pointer; text-align: left; }
:focus-visible { outline: 3px solid var(--bar); outline-offset: 2px; }

#app {
  height: 100%; box-sizing: border-box; max-width: 560px; margin-inline: auto; display: flex; flex-direction: column; background: var(--bg);
  padding-top: env(safe-area-inset-top, 0px);
}

/* Header */
.head { background: var(--head); color: var(--head-ink); padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.head-top { display: flex; align-items: center; gap: 6px; }
.back { width: 44px; height: 44px; margin-left: -10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--head-ink); border-radius: 10px; }
.titles { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.eyebrow { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--head-sub); }
.h1 { margin: 0; font-family: var(--font-num); font-size: 32px; font-weight: 700; line-height: 1; text-wrap: balance; }
.sub { font-size: 14px; color: var(--head-sub); }
.head-ctl { display: flex; flex-wrap: wrap; gap: 8px; }
.ctl {
  min-height: 44px; box-sizing: border-box; padding: 8px 12px; border-radius: 10px;
  background: var(--head-track); color: var(--head-ink); border: 1px solid transparent;
  font-size: 15px; font-weight: 600; flex: 1 1 150px; min-width: 0;
}
select.ctl { appearance: auto; }
.prog { display: flex; flex-direction: column; gap: 7px; }
.prog-line { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.prog-line .st { color: var(--bar); text-align: right; }
.track { height: 8px; border-radius: 4px; background: var(--head-track); overflow: hidden; }
.fill { height: 8px; border-radius: 4px; background: var(--bar); }
.chips { display: flex; gap: 8px; overflow-x: auto; margin-inline: -16px; padding-inline: 16px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.hchip {
  flex-shrink: 0; min-width: 52px; min-height: 44px; box-sizing: border-box; padding: 6px 12px; border-radius: 10px;
  background: var(--head-track); color: var(--head-sub); border: 2px solid transparent;
  font-family: var(--font-num); font-size: 20px; font-weight: 700; text-align: center;
}
.hchip.done { color: var(--bar); }
.hchip.cur { background: var(--head-ink); color: var(--head); border-color: var(--head-ink); }

/* Main list */
.main { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.sec { padding: 18px 16px 8px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sec-t { font-family: var(--font-num); font-size: 26px; font-weight: 700; line-height: 1; }
.sec-n { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.list { background: var(--surface); border-block: 1px solid var(--line); display: flex; flex-direction: column; }
.row {
  width: 100%; min-height: 64px; box-sizing: border-box; padding: 8px 16px;
  display: flex; align-items: center; gap: 14px; border-bottom: 1px solid var(--line);
}
.row:last-child { border-bottom: 0; }
.row .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row .t { font-size: 19px; font-weight: 600; }
.row .d { font-size: 14px; color: var(--muted); }
.num { width: 58px; flex-shrink: 0; font-family: var(--font-num); font-size: 32px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.lbl { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.pv { font-size: 16px; font-weight: 500; }
.pv.hot { color: var(--warn-ink); font-weight: 700; }
.pv.none { color: var(--muted); }
.pill {
  flex-shrink: 0; max-width: 46%; box-sizing: border-box; padding: 7px 12px; border-radius: 999px;
  font-size: 15px; font-weight: 700; text-align: center; overflow-wrap: anywhere;
  background: var(--surface); color: var(--muted); border: 1.5px solid var(--line-strong);
}
.pill.ok { background: var(--brand-soft); color: var(--brand-text); border-color: var(--brand-soft); }
.pill.hit { background: var(--warn-bg); color: var(--warn-ink); border-color: var(--warn-line); }
.tool { padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.tool .info { font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
.link { min-height: 44px; padding: 0 4px; color: var(--brand-text); font-size: 15px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.empty { margin: 24px 16px; padding: 22px 18px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px; }
.empty h2 { margin: 0; font-family: var(--font-num); font-size: 30px; font-weight: 700; line-height: 1.05; text-wrap: balance; }
.empty p { margin: 0; font-size: 16px; line-height: 1.45; color: var(--muted); }

/* Bottom bar and buttons */
.foot { background: var(--surface); border-top: 1px solid var(--line); padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 10px; }
.foot:empty { display: none; }
.btn {
  width: 100%; min-height: 56px; box-sizing: border-box; padding: 8px 16px; border-radius: 14px;
  background: var(--brand); color: var(--brand-ink); border: 2px solid var(--brand);
  font-size: 18px; font-weight: 700; text-align: center;
}
.btn.sec2 { background: var(--surface); color: var(--brand-text); border-color: var(--brand-text); }
.btn.narrow { width: auto; flex: 0 0 auto; }
.btn[disabled] { opacity: 0.45; cursor: default; }
.btns { display: flex; gap: 10px; }
.btns .btn { flex: 1; min-width: 0; }

/* Sheets */
.scrim { position: fixed; inset: 0; z-index: 10; background: var(--scrim); display: flex; flex-direction: column; justify-content: flex-end; }
.sheet {
  width: 100%; max-width: 560px; max-height: 94%; box-sizing: border-box; margin-inline: auto; overflow: hidden;
  background: var(--surface); border-radius: 22px 22px 0 0;
  display: flex; flex-direction: column;
}
.sh-body { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 16px 14px; display: flex; flex-direction: column; gap: 14px; }
.sh-foot { flex-shrink: 0; padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.sh-foot:empty { display: none; }
.sh-top { display: flex; align-items: flex-start; gap: 12px; }
.sh-top .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.sh-t { font-family: var(--font-num); font-size: 36px; font-weight: 700; line-height: 1; }
.sh-d { font-size: 15px; color: var(--muted); }
.x { width: 44px; height: 44px; flex-shrink: 0; border-radius: 12px; background: var(--bg); display: flex; align-items: center; justify-content: center; }
.hint { font-size: 16px; font-weight: 600; }
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.code {
  min-height: 48px; border-radius: 12px; text-align: center;
  font-family: var(--font-num); font-size: 23px; font-weight: 700;
  background: var(--surface); color: var(--ink); border: 2px solid var(--line-strong);
}
.code[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.code.more { font-family: var(--font); font-size: 15px; grid-column: span 2; color: var(--brand-text); border-style: dashed; }
.picked { padding: 10px 12px; border-radius: 12px; background: var(--bg); font-size: 15px; display: flex; flex-direction: column; gap: 4px; }
.picked b { font-weight: 700; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 14px; font-weight: 600; color: var(--muted); }
.inp { min-height: 48px; box-sizing: border-box; padding: 8px 12px; border-radius: 12px; border: 2px solid var(--line-strong); background: var(--surface); font-size: 16px; width: 100%; }
.cat { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; max-height: 46vh; overflow-y: auto; flex-shrink: 0; }
.cat button { min-height: 48px; padding: 8px 12px; display: flex; gap: 12px; align-items: baseline; border-bottom: 1px solid var(--line); }
.cat button:last-child { border-bottom: 0; }
.cat .c { width: 52px; flex-shrink: 0; font-family: var(--font-num); font-size: 21px; font-weight: 700; }
.cat .n { font-size: 14px; color: var(--muted); min-width: 0; }
.cat .big { font-size: 18px; font-weight: 600; }
.note { font-size: 15px; line-height: 1.4; }
.note.warn { padding: 10px 12px; border-radius: 12px; background: var(--warn-bg); color: var(--warn-ink); }
.note.err { color: var(--bad); font-weight: 600; }
.kv { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; }
.kv div { min-height: 48px; box-sizing: border-box; padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); font-size: 16px; }
.kv div:last-child { border-bottom: 0; }
.kv b { font-family: var(--font-num); font-size: 22px; font-variant-numeric: tabular-nums; text-align: right; }
.kv .yes { color: var(--brand-text); } .kv .no { color: var(--warn-ink); }
.chk { display: flex; align-items: center; gap: 12px; min-height: 44px; font-size: 16px; }
.chk input { width: 24px; height: 24px; accent-color: var(--brand); }
.del { align-self: center; min-height: 44px; color: var(--bad); font-size: 15px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.toast {
  position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 20;
  max-width: calc(100% - 32px); box-sizing: border-box; padding: 10px 16px; border-radius: 12px;
  background: var(--ink); color: var(--bg); font-size: 15px; font-weight: 600; text-align: center;
}
svg.i { fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<div id="app">
  <header class="head" id="head"></header>
  <main class="main" id="main"></main>
  <footer class="foot" id="foot"></footer>
</div>
<div id="sheet-root"></div>
<div class="toast" id="toast" role="status" hidden></div>
<input type="file" id="file-in" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>

<script>
(function () {
'use strict';

var APP_VERSION = '1.0';
var CAT = [["SAN","SANA"],["EDO","Enfermedad descomocida en observación (EDO)"],["ARJ","Anillo rojo/hoja pequeña (ARJ)"],["PES","Manchas foliares por Pestalotiopsis sp y otros hongos asociados (PES)"],["MYE","Mycosphaerella elaeidis (MYE)"],["MAR","Marchitez sorpresiva (MAR)"],["ACL","Anillo clorótico (ACL)"],["MLT","Marchitez letal (MLT)"],["MAF","Marchitez por Fusarium (MAF)"],["PFC","Pudrición de flecha/arqueo foliar comun (PFC)"],["PSC","Pudrición severa del cogollo (PSC)"],["FSR","Flecha Seca en recupéración (FSR)"],["FSF","Flecha Seca Recuperada con fruta (FSF)"],["FSA","Flecha Seca con solo hojas amarillas (FSA)"],["FST","Fleca Seca en recuperación con el cogollo torcido (FST)"],["PMT","Pudrición media del tallo (PMT)"],["MAN","Mancha anular (MAN)"],["PSR","Pudrición comun de flecha en recuperación (PSR)"],["PBH","Pudrición basal humeda (PBH)"],["PBS","Pudricion basal seca (PBS)"],["PBC","Pudrición basal corchosa (PBC)"],["PBG","Pudrición basal por Ganoderma (PBG)"],["PAT","Pudrición alta del tallo (PAT)"],["FS1","Flecha Seca clásica (FS1)"],["FS2","Flecha Seca clásica (FS2)"],["FS3","Flecha Seca clásica (FS3)"],["FS4","Flecha Seca clásica (FS4)"],["RAY","Daños por rayos (RAY)"],["FUE","Daño por fuego (FUE)"],["FCV","Fractura (doblamiento) de la corona por viento (FCV)"],["HER","Daño por herbicidas (HER)"],["PEV","Palma inyectada (envenenada) con herbicida (PEV)"],["FER","Quema o daño por fertilizante (FER)"],["DCR","Doblamiento de la corona en recuperación (DCR)"],["PRQ","Palma raquítica (PRQ)"],["FAL","Falla (FAL)"],["ANG","Anormalidad genética (ANG)"],["PIS","Palmas pisíferas e improductivas (PIS)"],["DRE","Mal drenaje (DRE)"],["DEH","Déficit hídrico (DEH)"],["PVI","Palma virada y/o desraizada (PVI)"],["POV","Palma voluntaria (POV)"],["DCE","Daño por corriente eléctrico (DCE)"],["PMS","Palma mal sembrada (PMS)"],["PMA","Palma muy alta (PMA)"],["PAR","Pudrición apical del racimo (PAR)"],["FAR","Falla de racimos (FAR)"],["RAN","Racimos o inflorescencias anormales (RAN)"],["DEN","Deficiencia de nitrogeno (DEN)"],["DEP","Deficiencia de fosforo (DEP)"],["DEB","Deficiencia de boro (DEB)"],["DEK","Manchas anaranjadas (hojas viejas) o amarillamiento medio de la corona por deficiencia de potasio (DEK)"],["DMG","Deficiencia de magnesio (DMG)"],["RYB","Raya blanca (RYB)"],["DK1","Deficiencia de potasio (DK1)"],["DK2","Deficiencia de potasio (DK2)"],["DK3","Deficiencia de potasio (DK3)"],["DK4","Deficiencia de potasio (DK4)"],["PNI","Plaga defoliadora no identificada y en observación (PNI)"],["HOR","Hormigas arrieras o cortadoras (zompopas) (HOR)"],["OPC","Opsiphanes cassina (OPC)"],["SIM","Acharia hyperoche (Sibine megasonoides) (SIM)"],["SIF","Sibine fusca (SIF)"],["OIK","Oiketicus kirby (OIK)"],["STC","Stenoma cecropia (STC)"],["AUT","Automeris sp. (AUT)"],["REE","Ácaros: Retracrus elaeidis (REE)"],["CCH","Chinches chupadores (CCH)"],["CHA","Saltamontes o chapulines (CHA)"],["CIG","Chupadores homópteros (cigarras) (CIG)"],["CCN","Cochinillas (CCN)"],["RHP","Rhynchophorus palmarum (RHP)"],["STA","Strategus aloeus (STA)"],["RHB","Rhinosthomus barbirostrib (RHB)"],["CYD","Cyparissius (Castnia) daedaus (CYD)"],["SAV","Sagalassa valida (SAV)"],["DUA","Durrantia sp. (DUA)"],["RAT","Ratas (RAT)"],["GAN","Daño por ganado (GAN)"],["CER","Daño por cerdos (CER)"],["ORT","Taltuzas (ORT)"],["CAP","Otros Roedores (capibaras) (CAP)"],["PER","Aves treapadoras (periquitos) (PER)"],["ZOP","Daño por zopilotes (ZOP)"],["DAR","Daño por ardilas (DAR)"],["ADA","Arbol dentro de area"],["DCV","Doblamiento de la corona por viento"],["ARF","Arqueo foliar"],["HORR","Hormigas recuperando"]];

var DESC = {};
CAT.forEach(function (c) { DESC[c[0]] = c[1]; });
var FREQ = ['FS1', 'FS2', 'FS3', 'FSR', 'FAL', 'ARF', 'PVI', 'PRQ', 'DEB', 'DMG', 'RYB', 'PFC', 'PSC', 'FCV', 'PBS', 'HOR', 'POV', 'PMS', 'RAY', 'ADA'];

/* ---------- State ---------- */
/* Base row = [hilera, palma, prevCode, prevObs, extra]. Mark = [code, extras, note, date, evaluator, ts]. */
var base = null, G = [], GBYDOC = {}, TOTAL = 0, PREV = '';
var cfg = { evaluador: '', survey: '', names: [] };
var V = { name: 'home', g: 0, hi: 0, rev: false };
var M = [];
var lastExport = 0;
var storeOk = true, persisted = null, offlineReady = false, installEvt = null;
var sheet = null, guard = false, filePurpose = '';

/* ---------- Helpers ---------- */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];

}

}
function lsGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { window.localStorage.setItem(k, v); return true; } catch (e) { return false; } }

var I_BACK = 'M15 6l-6 6 6 6', I_X = 'M6 6l12 12M18 6L6 18', I_NEXT = 'M9 6l6 6-6 6';
function toast(msg) {
  var t = document.getElementById('toast');

var KV = (function () {

  function req(mode, fn) {

      if (!db) { return Promise.reject(new Error('no-idb')); }
      return new Promise(function (res, rej) {
        var out, t = db.transaction('kv', mode);

        t.onerror = t.onabort = function () { rej(t.error || new Error('idb')); };

    get: function (k) {

    },
    prefix: function (p) {

          t.oncomplete = function () { res(out); };
          t.onerror = t.onabort = function () { rej(t.error || new Error('idb')); };
          var c = t.objectStore('kv').openCursor(window.IDBKeyRange.bound(p, p + '\uffff'));
          c.onsuccess = function () { var cur = c.result; if (cur) { out[cur.key] = cur.value; cur.continue(); } };
        });
      }).catch(function () { return {}; }).then(function (out) {
        try {
          for (var i = 0; i < window.localStorage.length; i++) {
            var k = window.localStorage.key(i);
            if (k.indexOf('kv:' + p) === 0 && out[k.slice(3)] === undefined) { out[k.slice(3)] = parse(window.localStorage.getItem(k), {}); }
          }

    }

})();

    g.rows.push([r.hil, r.palma, r.cod, r.obsn, extra]);
    if (r.por) { names[r.por] = (names[r.por] || 0) + 1; }
    n++;
  });
  var ym = mostCommon(tab.recs.map(function (r) { return r.fecha.slice(0, 7); }));
  var label = ym ? MESES[parseInt(ym.slice(5, 7), 10) - 1] : (mostCommon(tab.recs.map(function (r) { return r.mes; })) || 'Anterior');
  var evals = Object.keys(names).sort(function (a, b) { return names[b] - names[a]; }).filter(function (x) { return x.indexOf(' - ') === -1; }).slice(0, 8);
  return { v: 1, label: label, file: fileName, at: Date.now(), extraHead: tab.extraHead, groups: groups, evals: evals, n: n, dups: dups };
}
function planImport(tab) {
  var plan = { add: [], upd: [], same: 0, kept: 0, unknown: 0, otherMonth: '' }, months = [];
  tab.recs.forEach(function (r) {
    if (!r.cod || !r.fecha) { return; }
    var g = GBYDOC[docId(r.lote, r.centro, r.exp)];
    if (!g || g.byPalma[r.palma] == null) { plan.unknown++; return; }
    months.push(r.fecha.slice(0, 7));
    var cur = M[g.i][r.palma], item = { g: g, palma: r.palma, rec: [r.cod, '', r.obs, r.fecha, r.por, 0] };
    if (!cur || !cur[0]) { plan.add.push(item); return; }
    var curObs = [cur[1], cur[2]].filter(function (x) { return x; }).join(' · ');
    if (cur[0] === r.cod && cur[3] === r.fecha && curObs === r.obs) { plan.same++; return; }
    if (r.fecha > cur[3]) { plan.upd.push(item); } else { plan.kept++; }
  });
  var ym = mostCommon(months);
  if (ym && ym !== cfg.survey) { plan.otherMonth = surveyLabel(ym); }
  return plan;
}
function fail(msg) { openSheet({ type: 'msg', title: 'No se pudo leer', msg: msg, err: true }); }
function handleFile(file) {
  var purpose = (!base || filePurpose === 'base') ? 'base' : 'import';
  openSheet({ type: 'busy', title: 'Leyendo el archivo', msg: file.name });
  file.arrayBuffer().then(openXlsx).then(function (wb) {
    if (!wb.sheets.length) { throw new Error('empty'); }
    var use = function (i) {
      openSheet({ type: 'busy', title: 'Leyendo el archivo', msg: wb.sheets[i].name });
      return wb.rows(i).then(function (aoa) {
        var tab = tableOf(aoa);
        if (!tab || !tab.recs.length) { fail('La hoja "' + wb.sheets[i].name + '" no trae las columnas LOTE, CENTRO, EXPERIMENTO, PALMA y COD. ENF.'); return; }
        if (purpose === 'base') { openSheet({ type: 'base-ok', base: buildBase(tab, file.name), file: file.name }); }
        else { openSheet({ type: 'import-ok', plan: planImport(tab), file: file.name }); }
      });
    };
    if (wb.sheets.length === 1) { return use(0); }
    openSheet({ type: 'pick-sheet', names: wb.sheets.map(function (s) { return s.name; }), use: use });
  }).catch(function (e) {
    fail(e && e.message === 'inflate' ? 'Este navegador no puede abrir el archivo. Actualice Chrome e intente de nuevo.' : 'El archivo no es un Excel (.xlsx) válido.');
  });
}

/* ---------- Events ---------- */
document.addEventListener('click', function (ev) {
  var t = ev.target.closest ? ev.target.closest('[data-act]') : null;
  if (!t) { return; }
  var act = t.getAttribute('data-act');
  if (act === 'scrim') { if (ev.target === t && sheet && !mandatory()) { closeSheet(); } return; }
  if (t.disabled) { return; }
  var s = sheet, g, input = document.getElementById('file-in');
  switch (act) {
    case 'open': V = { name: 'centro', g: +t.getAttribute('data-g'), hi: 0, rev: false };
      g = G[V.g];
      for (var k = 0; k < g.groups.length; k++) { if (pendingIn(g, g.groups[k].idx).length) { V.hi = k; break; } }
      render(); document.getElementById('main').scrollTop = 0; break;
    case 'home': V = { name: 'home', g: V.g, hi: 0, rev: false }; render(); break;
    case 'hil': V.hi = +t.getAttribute('data-hi'); V.rev = false; render(); break;
    case 'rev': V.rev = !V.rev; render(); break;
    case 'palm': openPalm(+t.getAttribute('data-ri')); break;
    case 'close': if (!mandatory()) { closeSheet(); } break;
    case 'code': readNote();
      var c = t.getAttribute('data-c'), at = s.sel.indexOf(c);
      if (at === -1) { s.sel.push(c); } else { s.sel.splice(at, 1); }
      renderSheet(); break;
    case 'cat': readNote(); s.cat = true; s.q = ''; renderSheet(); break;
    case 'cat-back': s.cat = false; renderSheet(); break;
    case 'cat-pick': var cc = t.getAttribute('data-c'); if (s.sel.indexOf(cc) === -1) { s.sel.push(cc); } s.cat = false; renderSheet(); break;
    case 'san': readNote(); savePalm('SAN', ''); break;
    case 'save': readNote(); if (s.sel.length) { var p = principal(s.sel); savePalm(p, s.sel.filter(function (x) { return x !== p; }).join(', ')); } break;
    case 'clear': g = G[s.g]; M[g.i][g.rows[s.ri][1]] = ['', '', '', '', cfg.evaluador, Date.now()]; saveGroup(g); closeSheet(); render(); break;
    case 'bulk': startBulk(); break;
    case 'bulk-ok': g = G[s.g];
      s.san.forEach(function (pl) { M[g.i][pl] = makeRec('SAN', '', ''); });
      s.fal.forEach(function (pl) { M[g.i][pl] = makeRec('FAL', '', ''); });
      saveGroup(g); askPersist(); closeSheet(); render(); break;
    case 'eval': openSheet({ type: 'eval' }); break;
    case 'eval-pick': setEval(t.getAttribute('data-n')); break;
    case 'eval-other': var v = document.getElementById('eval-other').value.replace(/\s+/g, ' ').trim(); if (v) { setEval(v); } else { toast('Escriba el nombre.'); } break;
    case 'export': openSheet({ type: 'export', only: false, file: null, canShare: false }); prepareExport(); break;
    case 'exp-share':
      if (s.file) {
        navigator.share({ files: [s.file], title: s.file.name }).then(function () { markExported(s); }, function (e) {
          if (e && e.name === 'AbortError') { return; }
          s.msg = 'No se pudo compartir. Use Descargar.'; s.err = true; if (sheet === s) { renderSheet(); }
        });
      }
      break;
    case 'exp-save':
      if (s.file) {
        var url = URL.createObjectURL(s.file), a = document.createElement('a');
        a.href = url; a.download = s.file.name; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
        markExported(s);
      }
      break;
    case 'opts': openSheet({ type: 'opts' }); break;
    case 'pick-base': filePurpose = 'base'; input.value = ''; input.click(); break;
    case 'pick-import': filePurpose = 'import'; input.value = ''; input.click(); break;
    case 'sheet-pick': s.use(+t.getAttribute('data-i')).catch(function () { fail('No se pudo leer esa hoja.'); }); break;
    case 'base-ok':
      var nb = s.base;
      openSheet({ type: 'busy', title: 'Guardando la base', msg: '' });
      KV.set('base', nb).then(function () {
        setBase(nb); V = { name: 'home', g: 0, hi: 0, rev: false };
        return loadMarks();
      }).then(function () {
        closeSheet(); render(); askPersist();
        if (!cfg.evaluador) { openSheet({ type: 'eval' }); } else { toast('Base cargada: ' + fmt(TOTAL) + ' palmas'); }
      }, function () { fail('No se pudo guardar la base en este teléfono.'); });
      break;
    case 'import-ok':
      var plan = s.plan, touched = {}, now = Date.now();
      plan.add.concat(plan.upd).forEach(function (it) { it.rec[5] = now; M[it.g.i][it.palma] = it.rec; touched[it.g.i] = it.g; });
      Promise.all(Object.keys(touched).map(function (i) { return saveGroup(touched[i]); })).then(function () {
        closeSheet(); render(); toast('Se importaron ' + fmt(plan.add.length + plan.upd.length) + ' palmas');
      });
      break;
    case 'install':
      if (installEvt) { installEvt.prompt(); installEvt = null; closeSheet(); }
      break;
  }
});
document.getElementById('file-in').addEventListener('change', function (ev) {
  var f = ev.target.files && ev.target.files[0];
  if (f) { handleFile(f); }
});
document.addEventListener('input', function (ev) {
  if (ev.target.id === 'cat-q' && sheet && sheet.cat) {
    sheet.q = ev.target.value;
    document.getElementById('cat-list').innerHTML = catItems(catFilter(sheet.q));
  }
});
document.addEventListener('change', function (ev) {
  if (ev.target.id === 'survey-select') {
    cfg.survey = ev.target.value; saveCfg();
    loadMarks().then(render);
  } else if (ev.target.id === 'exp-only' && sheet && sheet.type === 'export') {
    sheet.only = ev.target.checked; prepareExport();
  }
});
window.addEventListener('popstate', function () {
  guard = false;
  if (sheet) { if (!mandatory()) { closeSheet(); } if (sheet || V.name === 'centro') { ensureGuard(); } }
  else if (V.name === 'centro') { V = { name: 'home', g: V.g, hi: 0, rev: false }; render(); }
});
window.addEventListener('beforeinstallprompt', function (ev) { ev.preventDefault(); installEvt = ev; if (sheet && sheet.type === 'opts') { renderSheet(); } });
window.addEventListener('appinstalled', function () { installEvt = null; });

/* ---------- Boot ---------- */
loadCfg();
renderNoBase();
KV.get('base').then(function (b) {
  if (!b || !b.groups || !b.groups.length) { return; }
  setBase(b); restoreView();
  return loadMarks().then(function () {
    render();
    if (!cfg.evaluador) { openSheet({ type: 'eval' }); }
  });
});
try {
  if (navigator.storage && navigator.storage.persisted) { navigator.storage.persisted().then(function (ok) { persisted = !!ok; }, function () {}); }
} catch (e) {}
if ('serviceWorker' in navigator && /^https?:$/.test(window.location.protocol)) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
  navigator.serviceWorker.ready.then(function () {
    offlineReady = true;
    if (!base) { renderNoBase(); } else if (sheet && sheet.type === 'opts') { renderSheet(); }
  }, function () {});
}
})();
</script>
